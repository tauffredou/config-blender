# Hand-written to match api/v1alpha1/configblend_types.go (no controller-gen
# wired into the build yet — docs/05-recipe-and-crd.md §5.4).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: configblends.configblender.io
spec:
  group: configblender.io
  names:
    kind: ConfigBlend
    listKind: ConfigBlendList
    plural: configblends
    singular: configblend
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Recipe
          type: string
          jsonPath: .spec.recipe
        - name: Target
          type: string
          jsonPath: .spec.target.configMapName
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [recipe, target]
              properties:
                recipe:
                  type: string
                  description: >-
                    Name of the Recipe to resolve, as stored by configblender
                    (docs/05-recipe-and-crd.md §5.2) — not a Kubernetes object.
                refreshInterval:
                  type: string
                  description: >-
                    Go duration string (e.g. "1h"). Defaults to 1h when unset
                    (docs/04-kubernetes.md §4.2).
                target:
                  type: object
                  required: [configMapName]
                  properties:
                    configMapName:
                      type: string
                      description: >-
                        Name of the ConfigMap configblender creates/keeps in
                        sync in the same namespace (docs/04-kubernetes.md §4.3).
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                lastResolvedTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
